site_name: Backend Wiki
site_description: A practical learning path for Ruby, Rails, and backend engineering.
site_url: https://yesheytenzin.github.io/wiki/
repo_name: yesheytenzin/wiki
repo_url: https://github.com/yesheytenzin/wiki

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Learning path: learning-path/index.md
      - Deep study method: learning-path/deep-study.md
      - Projects: learning-path/projects.md
      - Self-check questions: questions.md
      - Glossary: glossary.md
  - 1. Ruby:
      - Ruby fundamentals: ruby/fundamentals.md
      - Objects, modules, and blocks: ruby/objects-modules-blocks.md
      - Ruby internals and concurrency: ruby/internals-concurrency.md
      - Testing with RSpec: ruby/testing.md
  - 2. Web and data foundations:
      - HTTP and web architecture: backend/http.md
      - DNS, networking, and processes: backend/networking.md
      - PostgreSQL and data modeling: backend/postgresql.md
      - Redis and ephemeral data: backend/redis.md
      - Backend security: backend/security.md
  - 3. Rails application development:
      - Rails request lifecycle: rails/request-lifecycle.md
      - Routing, controllers, and responses: rails/routing-controllers.md
      - APIs and authentication: rails/apis-authentication.md
      - GraphQL fundamentals: graphql/fundamentals.md
      - GraphQL schemas and resolvers: graphql/schemas-resolvers.md
      - GraphQL security and performance: graphql/security-performance.md
      - GraphQL testing and operations: graphql/testing-operations.md
      - Active Record and transactions: rails/active-record.md
      - Validation and serialization: rails/validation-serialization.md
      - Background jobs: rails/background-jobs.md
  - 4. Architecture:
      - API design: architecture/api-design.md
      - SOLID design principles: architecture/solid.md
      - Queues and events: architecture/queues-events.md
      - Domain modeling and boundaries: architecture/domain-modeling.md
      - Consistency and concurrency: architecture/consistency.md
      - Distributed systems: production/distributed-systems.md
  - 5. Production:
      - Caching and performance: production/caching-performance.md
      - Observability and deployment: production/operations.md
      - Reliability and incident response: production/reliability.md
      - Capacity planning: production/capacity-planning.md
  - 6. Algorithms:
      - Complexity and data structures: algorithms/complexity.md
      - Algorithms for backend systems: algorithms/index.md
      - Pagination, rate limits, and scheduling: algorithms/patterns.md
  - Projects:
      - Project sequence: learning-path/projects.md
      - URL shortener: projects/url-shortener.md
      - Notification service: projects/notification-service.md
      - GraphQL content API: projects/graphql-content-api.md
  - Postmortems:
      - How to write a postmortem: postmortems/index.md
  - Resources:
      - Books, talks, and tools: resources/index.md
  - Contribute: contribute.md
